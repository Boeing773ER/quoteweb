<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-label="Yes Minister poster">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="0.55" stop-color="#1b2a41"/>
      <stop offset="1" stop-color="#0a1522"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0b44a" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#e0b44a" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffd97a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd97a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="900" fill="url(#bg)"/>
  <rect width="600" height="900" fill="url(#lamp)"/>

  <g opacity="0.35" fill="#28405c">
    <rect x="60" y="470" width="480" height="300" rx="6"/>
  </g>

  <!-- government building -->
  <g>
    <rect x="90" y="470" width="420" height="300" fill="#16283f" stroke="#3d5a80" stroke-width="2"/>
    <rect x="60" y="440" width="480" height="34" fill="#22364f" stroke="#3d5a80" stroke-width="2"/>
    <polygon points="300,330 560,440 40,440" fill="#122238" stroke="#3d5a80" stroke-width="2"/>
    <rect x="118" y="510" width="26" height="220" fill="#0d1b2a"/>
    <rect x="186" y="510" width="26" height="220" fill="#0d1b2a"/>
    <rect x="254" y="510" width="26" height="220" fill="#0d1b2a"/>
    <rect x="322" y="510" width="26" height="220" fill="#0d1b2a"/>
    <rect x="390" y="510" width="26" height="220" fill="#0d1b2a"/>
    <rect x="458" y="510" width="26" height="220" fill="#0d1b2a"/>
    <rect x="276" y="560" width="48" height="210" fill="#0a1522" stroke="#3d5a80" stroke-width="2"/>
    <circle cx="300" cy="400" r="16" fill="url(#glow)"/>
  </g>

  <!-- silhouettes: minister (left) and civil servant (right) -->
  <g fill="#0a1522">
    <g transform="translate(150,560)">
      <circle cx="0" cy="-34" r="20"/>
      <path d="M-30,120 L-30,10 Q0,-14 30,10 L30,120 Z"/>
      <path d="M-6,-14 L6,-14 L4,20 L-4,20 Z" fill="#e0b44a"/>
    </g>
    <g transform="translate(450,560)">
      <circle cx="0" cy="-34" r="20"/>
      <path d="M-30,120 L-30,10 Q0,-14 30,10 L30,120 Z"/>
      <path d="M-14,10 L14,10 L12,60 L-12,60 Z" fill="#4a5a6a"/>
      <path d="M-8,-52 L8,-52 L6,-64 L-6,-64 Z" fill="#2b3540"/>
    </g>
  </g>

  <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text x="300" y="150" fill="#e0b44a" font-size="30" letter-spacing="14" font-weight="700">BBC</text>
    <text x="300" y="250" fill="#f4f1ea" font-size="88" font-weight="700" letter-spacing="2">YES</text>
    <text x="300" y="330" fill="#f4f1ea" font-size="64" font-weight="700" letter-spacing="6">MINISTER</text>
    <text x="300" y="862" fill="#8fa6c0" font-size="34" letter-spacing="8">是，大臣</text>
  </g>
  <text x="300" y="382" fill="#e0b44a" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="10">1980 – 1984</text>
</svg>
