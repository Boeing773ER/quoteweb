<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-label="Yes, Prime Minister poster">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0d0d"/>
      <stop offset="0.55" stop-color="#3d1414"/>
      <stop offset="1" stop-color="#1c0808"/>
    </linearGradient>
    <linearGradient id="doorwood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="lamp2" cx="0.5" cy="0.34" r="0.72">
      <stop offset="0" stop-color="#ffcf6b" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffcf6b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="900" fill="url(#bg2)"/>
  <rect width="600" height="900" fill="url(#lamp2)"/>

  <!-- No.10 facade -->
  <rect x="70" y="430" width="460" height="340" fill="#241010" stroke="#7a4a3a" stroke-width="2"/>
  <rect x="70" y="410" width="460" height="26" fill="#2e1414" stroke="#7a4a3a" stroke-width="2"/>

  <!-- door -->
  <rect x="252" y="500" width="96" height="270" rx="4" fill="url(#doorwood)" stroke="#d9c08a" stroke-width="3"/>
  <rect x="264" y="516" width="72" height="70" rx="3" fill="#0b0b0b" stroke="#5a4a2a" stroke-width="1.5"/>
  <rect x="264" y="600" width="72" height="70" rx="3" fill="#0b0b0b" stroke="#5a4a2a" stroke-width="1.5"/>
  <rect x="264" y="684" width="72" height="70" rx="3" fill="#0b0b0b" stroke="#5a4a2a" stroke-width="1.5"/>
  <circle cx="336" cy="636" r="6" fill="#d9c08a"/>

  <!-- lamp above door -->
  <circle cx="300" cy="452" r="13" fill="#ffd97a" opacity="0.9"/>
  <rect x="296" y="402" width="8" height="40" fill="#3a2a1a"/>

  <!-- windows -->
  <g fill="#1a0c0c" stroke="#6a3f2f" stroke-width="2">
    <rect x="112" y="520" width="70" height="90" rx="3"/>
    <rect x="418" y="520" width="70" height="90" rx="3"/>
    <rect x="112" y="650" width="70" height="90" rx="3"/>
    <rect x="418" y="650" width="70" height="90" rx="3"/>
  </g>

  <!-- PM silhouette in doorway -->
  <g fill="#000000" opacity="0.96">
    <circle cx="300" cy="596" r="18"/>
    <path d="M274,770 L274,632 Q300,606 326,632 L326,770 Z"/>
  </g>

  <!-- flag -->
  <rect x="120" y="300" width="6" height="140" fill="#5a4a2a"/>
  <rect x="126" y="300" width="70" height="44" fill="#0d1b3a"/>
  <path d="M126,300 L196,344 M196,300 L126,344" stroke="#c8102e" stroke-width="6"/>
  <path d="M126,322 L196,322" stroke="#f4f1ea" stroke-width="8"/>
  <path d="M161,300 L161,344" stroke="#f4f1ea" stroke-width="8"/>
  <path d="M126,322 L196,322" stroke="#c8102e" stroke-width="4"/>
  <path d="M161,300 L161,344" stroke="#c8102e" stroke-width="4"/>

  <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text x="300" y="150" fill="#d9c08a" font-size="30" letter-spacing="14" font-weight="700">BBC</text>
    <text x="300" y="250" fill="#f4f1ea" font-size="80" font-weight="700" letter-spacing="2">YES,</text>
    <text x="300" y="326" fill="#f4f1ea" font-size="52" font-weight="700" letter-spacing="3">PRIME</text>
    <text x="300" y="382" fill="#f4f1ea" font-size="52" font-weight="700" letter-spacing="3">MINISTER</text>
    <text x="300" y="862" fill="#c99a9a" font-size="34" letter-spacing="8">是，首相</text>
  </g>
  <text x="300" y="416" fill="#d9c08a" text-anchor="middle" font-family="Georgia, serif" font-size="22" letter-spacing="10">1986 – 1988</text>
</svg>
